name: Build Backend Project

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Lint code
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Upload production-ready code (optional)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
